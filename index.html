/* ---------- localStorage-backed replacement for the Claude-artifact
   window.storage API, so the persistence logic below needs no changes ---------- */
window.storage = {
  get: async (key) => {
    const v = window.localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  set: async (key, value) => {
    window.localStorage.setItem(key, value);
    return { key, value };
  },
  delete: async (key) => {
    window.localStorage.removeItem(key);
    return { key, deleted: true };
  },
  list: async (prefix) => {
    const keys = Object.keys(window.localStorage).filter((k) => !prefix || k.startsWith(prefix));
    return { keys };
  },
};

function parseLuggageSizeString(str) {
  const map = {};
  if (!str) return map;
  String(str)
    .split(/[、,，]/)
    .forEach((part) => {
      const trimmed = part.trim();
      if (!trimmed) return;
      const m = trimmed.match(/^(.+?)\s*[xX×]\s*(\d+)$/);
      if (m) {
        map[m[1].trim()] = parseInt(m[2], 10);
      } else {
        map[trimmed] = (map[trimmed] || 0) + 1;
      }
    });
  return map;
}

function serializeLuggageSizeMap(map) {
  return Object.entries(map)
    .filter(([, qty]) => qty > 0)
    .map(([size, qty]) => `${size} x${qty}`)
    .join("、");
}

function pad(n, len) {
  return String(n).padStart(len, "0");
}

function generateOrderNumber(date) {
  const d = date || new Date();
  const datePart = `${d.getFullYear()}${pad(d.getMonth() + 1, 2)}${pad(d.getDate(), 2)}`;
  const timePart = `${pad(d.getHours(), 2)}${pad(d.getMinutes(), 2)}${pad(d.getSeconds(), 2)}`;
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let rand = "";
  for (let i = 0; i < 4; i++) rand += chars[Math.floor(Math.random() * chars.length)];
  return `DC-${datePart}-${timePart}-${rand}`;
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)} ${pad(
    d.getHours(),
    2
  )}:${pad(d.getMinutes(), 2)}`;
}

function isValidPhone(phone) {
  const digits = String(phone || "").replace(/[-\s]/g, "");
  // Taiwan mobile (09xxxxxxxx, 10 digits) or landline (0x-xxxxxxx, 9-10 digits total).
  return /^0\d{8,9}$/.test(digits);
}

function isPastDate(dateStr) {
  if (!dateStr) return false;
  const today = new Date();
  const todayISO = `${today.getFullYear()}-${pad(today.getMonth() + 1, 2)}-${pad(today.getDate(), 2)}`;
  return dateStr < todayISO;
}

function isLikelyValidPlate(plate) {
  if (!plate || !plate.trim()) return true; // optional field, empty is fine
  const compact = plate.replace(/[-\s]/g, "");
  return /^[A-Za-z0-9]{5,8}$/.test(compact) && /[A-Za-z]/.test(compact) && /[0-9]/.test(compact);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const chars = String(text).split("");
  let line = "";
  let lines = 0;
  let curY = y;
  for (let i = 0; i < chars.length; i++) {
    const test = line + chars[i];
    if (ctx.measureText(test).width > maxWidth && line !== "") {
      ctx.fillText(line, x, curY);
      line = chars[i];
      curY += lineHeight;
      lines += 1;
      if (maxLines && lines >= maxLines - 1) {
        const rest = chars.slice(i + 1).join("");
        line = line + (rest ? "…" : "");
        break;
      }
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, curY);
  return curY;
}

async function drawTicketCanvas(order) {
  const SCALE = 3; // higher render resolution for crisper, print-quality text
  const W = 700;
  const H = 940;
  const canvas = document.createElement("canvas");
  canvas.width = W * SCALE;
  canvas.height = H * SCALE;
  const ctx = canvas.getContext("2d");

  const NAVY = "#101B2D";
  const WHITE = "#FFFFFF";
  const AMBER = "#E8A33D";
  const TEAL = "#1F8A70";
  const SLATE = "#5B6B84";
  const GRAPHITE = "#1B2436";

  try {
    await Promise.all([
      document.fonts.load('700 30px "JetBrains Mono"'),
      document.fonts.load('700 19px "JetBrains Mono"'),
      document.fonts.load('600 12px "Noto Sans TC"'),
      document.fonts.load('700 19px "Noto Sans TC"'),
      document.fonts.load('700 30px "Noto Sans TC"'),
      document.fonts.load('400 15px "Noto Sans TC"'),
    ]);
  } catch (e) {
    /* fall back silently */
  }

  // base
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, W, H);

  // stub
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, 140, H);

  // vertical label on stub
  ctx.save();
  ctx.translate(28, H - 40);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = '600 13px "Noto Sans TC", sans-serif';
  ctx.textBaseline = "middle";
  ctx.fillText("D I S P A T C H   T I C K E T   派 車 調 度 單", 0, 0);
  ctx.restore();

  // order number on stub — drawn as genuinely rotated vertical text
  // (matching the on-screen preview's `writing-mode: vertical-rl`),
  // rather than horizontal lines stacked on top of each other. The last
  // hyphen-separated segment (the random suffix, in this format) is
  // highlighted in amber; works for any number of segments.
  ctx.save();
  ctx.translate(38, 58);
  ctx.rotate(Math.PI / 2);
  ctx.font = '700 24px "JetBrains Mono", monospace';
  ctx.textBaseline = "alphabetic";
  const lastDash = order.orderNumber.lastIndexOf("-");
  const mainPart = lastDash !== -1 ? order.orderNumber.slice(0, lastDash + 1) : order.orderNumber;
  const lastPart = lastDash !== -1 ? order.orderNumber.slice(lastDash + 1) : "";
  ctx.fillStyle = WHITE;
  ctx.fillText(mainPart, 0, 0);
  const mainWidth = ctx.measureText(mainPart).width;
  ctx.fillStyle = AMBER;
  ctx.fillText(lastPart, mainWidth, 0);
  ctx.restore();


  // seal
  ctx.beginPath();
  ctx.arc(70, H - 90, 34, 0, Math.PI * 2);
  ctx.fillStyle = AMBER;
  ctx.fill();
  ctx.fillStyle = NAVY;
  ctx.font = '700 26px "Noto Sans TC", sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("派", 70, H - 89);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  // perforation tear line
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 7]);
  ctx.beginPath();
  ctx.moveTo(140, 0);
  ctx.lineTo(140, H);
  ctx.stroke();
  ctx.setLineDash([]);

  const LX = 182;
  const RX = 670;
  const colW = (RX - LX) / 2;

  // header
  ctx.fillStyle = GRAPHITE;
  ctx.font = '700 30px "Noto Sans TC", sans-serif';
  ctx.fillText("接送派車單", LX, 62);

  ctx.fillStyle = SLATE;
  ctx.font = '600 13px "JetBrains Mono", monospace';
  ctx.textAlign = "right";
  ctx.fillText("CAR DISPATCH ORDER", RX, 56);
  ctx.textAlign = "left";

  ctx.strokeStyle = "#D7DBE2";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(LX, 84);
  ctx.lineTo(RX, 84);
  ctx.stroke();

  // field helpers — bold, high-contrast, tightly spaced for a compact,
  // ticket-sized layout that mirrors the on-screen preview card.
  function label(text, x, y) {
    ctx.fillStyle = SLATE;
    ctx.font = '600 12px "Noto Sans TC", sans-serif';
    ctx.fillText(text, x, y);
  }
  function value(text, x, y, mono = false) {
    ctx.fillStyle = GRAPHITE;
    ctx.font = mono ? '700 19px "JetBrains Mono", monospace' : '700 19px "Noto Sans TC", sans-serif';
    ctx.fillText(text || "-", x, y);

  let y = 118;
  label("客戶姓名", LX, y);
  label("聯絡電話", LX + colW, y);
  y += 22;
  value(order.customerName, LX, y);

  y += 40;
  label("行程", LX, y);
  y += 24;
  ctx.font = '700 20px "Noto Sans TC", sans-serif';
  const routeStops = [order.pickup || "-", order.waypoint, order.dropoff || "-"].filter(Boolean);
  const routeTokens = [];
  routeStops.forEach((stop, i) => {
    for (const ch of stop) routeTokens.push({ ch, color: GRAPHITE });
    if (i < routeStops.length - 1) {
      for (const ch of " → ") routeTokens.push({ ch, color: AMBER });
    }
  });
  const routeMaxWidth = RX - LX;
  const routeLineHeight = 26;
  let routeX = LX;
  let routeY = y;
  routeTokens.forEach((t) => {
    const w = ctx.measureText(t.ch).width;
    if (routeX + w > LX + routeMaxWidth && routeX > LX) {
      routeY += routeLineHeight;
      routeX = LX;
    }
    ctx.fillStyle = t.color;
    ctx.fillText(t.ch, routeX, routeY);

  y = routeY;

  y += 38;
  label("用車日期", LX, y);
  label("用車時間", LX + colW, y);
  y += 22;

  value(order.time, LX + colW, y, true);

  const hasQty = (v) => v && v !== "0";

  y += 40;

  label("搭乘人數", LX + colW, y);
  y += 22;
  value(order.flightNo, LX, y, true);

  y += 40;

  y += 22;
  value(hasQty(order.boosterSeat) ? `${order.boosterSeat} 個` : "", LX, y);
  value(hasQty(order.childSeat) ? `${order.childSeat} 個` : "", LX + colW, y);

  y += 40;
  label("收據", LX, y);
  label("費用", LX + colW, y);
  y += 22;
  value(hasQty(order.receipt) ? `${order.receipt} 份` : "", LX, y);
  value(hasVal(order.price) ? `NT$ ${order.price}` : "", LX + colW, y, true);

  y += 40;
  label("司機", LX, y);
  label("司機電話", LX + colW, y);
  y += 22;
  value(order.driver || "待指派", LX, y);
  value(order.driverPhone, LX + colW, y, true);

  y += 40;
  label("車型", LX, y);
  label("車款", LX + colW, y);
  y += 22;
  value(order.carType, LX, y);
  value(order.carModel, LX + colW, y);

  y += 40;
  label("車號", LX, y);
  label("車色", LX + colW, y);
  y += 22;
  value(order.plate || "待指派", LX, y, true);
  value(order.carColor, LX + colW, y);

  y += 34;
  ctx.strokeStyle = "#E4E7EC";
  ctx.beginPath();
  ctx.moveTo(LX, y);
  ctx.lineTo(RX, y);
  ctx.stroke();

  y += 24;
  label("備註", LX, y);
  y += 22;
  ctx.fillStyle = GRAPHITE;
  ctx.font = '400 15px "Noto Sans TC", sans-serif';
  wrapText(ctx, order.notes || "無", LX, y, RX - LX - 160, 20, 3);

  // footer
  ctx.fillStyle = SLATE;
  ctx.font = '400 12px "JetBrains Mono", monospace';
  ctx.fillText(`建立時間 ${fmtDateTime(order.createdAt)}`, LX, H - 24);

  // status badge
  const statusText = order.status || "待確認";
  const statusMeta = STATUS_META[statusText] || STATUS_META["待確認"];
  const badgeText = `${statusText} ${statusMeta.en}`;
  ctx.font = '700 12px "JetBrains Mono", monospace';
  const bw = ctx.measureText(badgeText).width + 26;
  ctx.fillStyle = statusMeta.color;
  const bx = RX - bw;
  const by = H - 40;
  const bh = 26;
  const r = 13;
  ctx.beginPath();
  ctx.moveTo(bx + r, by);
  ctx.arcTo(bx + bw, by, bx + bw, by + bh, r);
  ctx.arcTo(bx + bw, by + bh, bx, by + bh, r);
  ctx.arcTo(bx, by + bh, bx, by, r);
  ctx.arcTo(bx, by, bx + bw, by, r);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = WHITE;
  ctx.fillText(badgeText, bx + 14, by + 20);

  return canvas;

// ---- export helpers: Blob-based, cross-platform (Chrome / Safari / Edge / Android / iPhone / iPad) ----

function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error("無法產生圖片 Blob"));
    }, "image/png");
  });
}

// For the on-screen preview <img> only (not for saving/sharing). Some
// browsers fail to paint blob: object URLs — showing a blank white box
// with no error — when the page is opened via file:// or inside certain
// in-app WebViews. Reading the blob back out as a data URL sidesteps
// that and always renders.
function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("無法讀取圖片內容"));
    reader.readAsDataURL(blob);
  });
}

// Returns true on success, "cancelled" if the user dismissed the share
// sheet without picking anything, or false if the Web Share API for
// files isn't available/usable here (caller should fall back).
async function shareFile(file) {
  if (!navigator.share || !navigator.canShare || !navigator.canShare({ files: [file] })) {
    return false;
  }
  try {
    await navigator.share({ files: [file], title: file.name });
    return true;
  } catch (err) {
    if (err && err.name === "AbortError") return "cancelled";
    console.warn("navigator.share failed", err);
    return false;
  }
}

function OptionalRow({ label1, val1, label2, val2, mono1, mono2 }) {
  const has1 = !!val1;
  const has2 = !!val2;
  if (!has1 && !has2) return null;
  if (has1 && has2) {
    return (
      <div className="t-row">
        <div>
          <div className="t-label">{label1}</div>
          <div className={"t-val" + (mono1 ? " mono" : "")}>{val1}</div>
        </div>
        <div>
          <div className="t-label">{label2}</div>
          <div className={"t-val" + (mono2 ? " mono" : "")}>{val2}</div>
        </div>
      </div>
    );
  }
  const label = has1 ? label1 : label2;
  const val = has1 ? val1 : val2;
  const mono = has1 ? mono1 : mono2;
  return (
    <div>
      <div className="t-label">{label}</div>
      <div className={"t-val" + (mono ? " mono" : "")}>{val}</div>
    </div>
  );
}

  async function callClaudeParse(text, correction) {

  function cnToNumber(raw) {
    if (raw == null) return null;
    const str = String(raw).trim();
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    const map = { "零": 0, "一": 1, "二": 2, "兩": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10 };
    if (str.length === 1) return map[str] != null ? map[str] : null;
    if (str.length === 2 && str[0] === "十") return 10 + (map[str[1]] || 0);
    if (str.length === 2 && str[1] === "十") return (map[str[0]] || 0) * 10;
    if (str.length === 3 && str[1] === "十") return (map[str[0]] || 0) * 10 + (map[str[2]] || 0);
    return null;
  }

  const KNOWN_PLACES = [
    { names: ["桃園機場第一航廈", "桃機一航", "桃園機場一航"], canonical: "桃園機場第一航廈" },
    { names: ["桃園機場第二航廈", "桃機二航", "桃園機場二航"], canonical: "桃園機場第二航廈" },
    { names: ["松山機場", "松機"], canonical: "松山機場" },
    { names: ["高鐵台中站", "台中高鐵"], canonical: "高鐵台中站" },
    { names: ["高雄左營站", "左營高鐵"], canonical: "高雄左營站" },
    { names: ["台北車站"], canonical: "台北車站" },
    { names: ["台北君悅", "君悅酒店", "君悅"], canonical: "台北君悅酒店" },
    { names: ["台北萬豪", "萬豪酒店"], canonical: "台北萬豪酒店" },
    { names: ["台中林酒店"], canonical: "台中林酒店" },
    { names: ["高雄漢來"], canonical: "高雄漢來大飯店" },
    { names: ["台南晶英"], canonical: "台南晶英酒店" },
    { names: ["W Hotel", "W飯店"], canonical: "W Hotel" },
  ];

  function findPlaces(text) {
    const hits = [];
    for (const place of KNOWN_PLACES) {
      for (const alias of place.names) {
        const idx = text.indexOf(alias);
        if (idx !== -1) {
          hits.push({ index: idx, canonical: place.canonical });
          break;
        }
      }
    }
    hits.sort((a, b) => a.index - b.index);
    return hits;
  }

  function normalizeDateValue(raw) {
    if (!raw) return "";
    const s = raw.trim();
    const relDate = s.match(/(今天|明天|後天)/);
    const isoDate = s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    const cnDate = s.match(/(\d{1,2})月(\d{1,2})[日號]/);
    const slashDate = s.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
    if (relDate) {
      const offset = relDate[1] === "今天" ? 0 : relDate[1] === "明天" ? 1 : 2;
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
    }
    if (isoDate) return `${isoDate[1]}-${pad(Number(isoDate[2]), 2)}-${pad(Number(isoDate[3]), 2)}`;
    if (cnDate) {
      const year = new Date().getFullYear();
      return `${year}-${pad(Number(cnDate[1]), 2)}-${pad(Number(cnDate[2]), 2)}`;
    }
    if (slashDate) {
      const year = new Date().getFullYear();
      return `${year}-${pad(Number(slashDate[1]), 2)}-${pad(Number(slashDate[2]), 2)}`;
    }
    return "";
  }

  function normalizeTimeValue(raw) {
    if (!raw) return "";
    const s = raw.trim();
    const clockTime = s.match(/(上午|下午)?\s*(\d{1,2})[:：](\d{2})/);
    const wordTime = s.match(/(上午|下午)?\s*(\d{1,2})\s*點\s*(半)?/);
    if (clockTime) {
      let h = Number(clockTime[2]);
      const m = clockTime[3];
      if (clockTime[1] === "下午" && h < 12) h += 12;
      if (clockTime[1] === "上午" && h === 12) h = 0;
      return `${pad(h, 2)}:${m}`;
    }
    if (wordTime) {
      let h = Number(wordTime[2]);
      if (wordTime[1] === "下午" && h < 12) h += 12;
      if (wordTime[1] === "上午" && h === 12) h = 0;
      const m = wordTime[3] ? "30" : "00";
      return `${pad(h, 2)}:${m}`;
    }
    return "";
  }

  // Detects the fixed "機場派車單" fill-in-the-blank template (labels
  // followed by a full-width or half-width colon, one per line). When the
  // pasted text matches this template, parsing by label is far more
  // reliable than the free-text heuristics in localParse(), since the
  // customer/staff already did the work of labeling each field.
  function isStructuredTemplate(text) {
    const markers = ["乘客姓名", "機場派車單", "班機", "增高墊", "安全椅"];
    const hits = markers.filter((m) => text.includes(m)).length;
    return hits >= 2;
  }

  function parseStructuredTemplate(text) {
    const result = {};
    const setField = (key, value, confidence = 0.97) => {
      if (result[key] && result[key].value) return; // first occurrence wins (e.g. repeated 電話 handled separately)
      result[key] = { value: value || "", confidence: value ? confidence : 0 };
    };

    const LABEL_MAP = {
      "乘客姓名": "customerName",
      "姓名": "customerName",
      "日期": "date",
      "時間": "time",
      "上車": "pickup",
      "中途": "waypoint",
      "下車": "dropoff",
      "人數": "passengers",
      "行李": "luggageCount",
      "尺寸": "luggageSize",
      "班機": "flightNo",
      "增高墊": "boosterSeat",
      "安全椅": "childSeat",
      "收據": "receipt",
      "費用": "price",
      "價格": "price",
      "車資": "price",
      "駕駛": "driver",
      "車型": "carType",
      "車色": "carColor",
      "車牌": "plate",
    };

    let afterDriver = false;
    const lines = text.split(/\r?\n/);
    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) continue;
      const m = line.match(/^([^\s:：]+?)[（(]?\s*[:：]\s*(.*)$/);
      if (!m) continue;
      let label = m[1].replace(/[（(]必填[）)]?/g, "").trim();
      const value = m[2].trim();

      if (label === "駕駛") afterDriver = true;

      if (label === "電話") {
        setField(afterDriver ? "driverPhone" : "phone", value.replace(/[-\s]/g, ""), 0.97);
        continue;
      }

      const key = LABEL_MAP[label];
      if (!key) continue;

      if (key === "date") {
        setField("date", normalizeDateValue(value) || value, 0.95);
      } else if (key === "time") {
        setField("time", normalizeTimeValue(value) || value, 0.95);
      } else if (key === "passengers" || key === "luggageCount" || key === "boosterSeat" || key === "childSeat") {
        const num = cnToNumber(value.replace(/[^0-9一二兩三四五六七八九十]/g, ""));
        setField(key, num != null ? String(num) : value, 0.95);
      } else if (key === "carType") {
        if (CAR_TYPES.includes(value)) {
          setField("carType", value, 0.97);
        } else {
          setField("carType", "");
          if (value) setField("carModel", value, 0.8);
        }
      } else {
        setField(key, value, 0.97);
      }
    }

    for (const key of AI_FIELD_KEYS) {
      if (!result[key]) result[key] = { value: "", confidence: 0 };
    }
    return result;
  }

  function localParse(text) {
    const result = {};

    const setField = (key, value, confidence = 1) => {
      result[key] = {
        value: value || "",
        confidence: value ? confidence : 0,
      };
    };

    // 電話（09開頭10碼，或 +886 開頭）
    const phone = text.match(/(?:\+?886[-\s]?9|09)\d{2}[-\s]?\d{3}[-\s]?\d{3}/);
    if (phone) {
      let digits = phone[0].replace(/[-\s]/g, "");
      digits = digits.replace(/^\+?886/, "0");
      setField("phone", digits, 0.99);
    } else {
      setField("phone", "");
    }

    // 航班（可接受連字號，如 CI-123）
    const flight = text.match(/[A-Z]{2}[\s-]?\d{2,4}/i);
    setField("flightNo", flight ? flight[0].replace(/[\s-]/g, "").toUpperCase() : "", 0.95);

    // 人數（阿拉伯數字或中文數字）
    const p = text.match(/([0-9一二兩三四五六七八九十]+)\s*(位|人)/);
    const pNum = p ? cnToNumber(p[1]) : null;
    setField("passengers", pNum != null ? String(pNum) : "", 0.9);

    // 行李（阿拉伯數字或中文數字）
    const luggage = text.match(/([0-9一二兩三四五六七八九十]+)\s*(件|咖|箱|個)行李?/);
    const lNum = luggage ? cnToNumber(luggage[1]) : null;
    setField("luggageCount", lNum != null ? String(lNum) : "", 0.9);

    // 日期：支援 7/22、2026-07-22、2026/7/22、7月22日、以及明天/後天/今天
    let dateValue = "";
    const relDate = text.match(/(今天|明天|後天)/);
    const isoDate = text.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    const cnDate = text.match(/(\d{1,2})月(\d{1,2})[日號]/);
    const slashDate = text.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);
    if (relDate) {
      const offset = relDate[1] === "今天" ? 0 : relDate[1] === "明天" ? 1 : 2;
      const d = new Date();
      d.setDate(d.getDate() + offset);
      dateValue = `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
    } else if (isoDate) {
      dateValue = `${isoDate[1]}-${pad(Number(isoDate[2]), 2)}-${pad(Number(isoDate[3]), 2)}`;
    } else if (cnDate) {
      const year = new Date().getFullYear();
      dateValue = `${year}-${pad(Number(cnDate[1]), 2)}-${pad(Number(cnDate[2]), 2)}`;
    } else if (slashDate) {
      const year = new Date().getFullYear();
      dateValue = `${year}-${pad(Number(slashDate[1]), 2)}-${pad(Number(slashDate[2]), 2)}`;
    }
    setField("date", dateValue, 0.9);

    // 時間：優先抓明確的 HH:MM，其次抓「上午/下午 + 數字 + 點（半）」，避免誤抓電話號碼裡的數字
    let timeValue = "";
    const clockTime = text.match(/(上午|下午)?\s*(\d{1,2})[:：](\d{2})/);
    const wordTime = text.match(/(上午|下午)\s*(\d{1,2})\s*點\s*(半)?/);
    if (clockTime) {
      let h = Number(clockTime[2]);
      const m = clockTime[3];
      if (clockTime[1] === "下午" && h < 12) h += 12;
      if (clockTime[1] === "上午" && h === 12) h = 0;
      timeValue = `${pad(h, 2)}:${m}`;
    } else if (wordTime) {
      let h = Number(wordTime[2]);
      if (wordTime[1] === "下午" && h < 12) h += 12;
      if (wordTime[1] === "上午" && h === 12) h = 0;
      const m = wordTime[3] ? "30" : "00";
      timeValue = `${pad(h, 2)}:${m}`;
    }
    setField("time", timeValue, 0.85);

    // 上/下車地點：比對已知地點清單（機場航廈、飯店、車站），
    // 用「從／到／送／去」等方向詞判斷哪個是上車、哪個是下車
    const places = findPlaces(text);
    if (places.length >= 2) {
      setField("pickup", places[0].canonical, 0.85);
      setField("dropoff", places[1].canonical, 0.85);
    } else if (places.length === 1) {
      const before = text.slice(Math.max(0, places[0].index - 3), places[0].index);
      const isDropoff = /送到|送去|到|去/.test(before);
      if (isDropoff) {
        setField("pickup", "");
        setField("dropoff", places[0].canonical, 0.75);
      } else {
        setField("pickup", places[0].canonical, 0.75);
        setField("dropoff", "");
      }
    } else {
      setField("pickup", "");
      setField("dropoff", "");
    }

    // 姓名：優先抓「X先生/小姐/女士」，抓不到再退回常見姓氏比對
    const titleName = text.match(/([\u4e00-\u9fa5]{1,3})(先生|小姐|女士)/);
    const surnameName = text.match(/(王|李|陳|林|張|黃|吳|劉|蔡|楊|周|徐|孫|馬|郭|謝|許|鄭|曾|廖|賴|洪|周|葉|蘇|盧)[^\s，。]{1,2}/);
    if (titleName) {
      setField("customerName", titleName[0], 0.85);
    } else if (surnameName) {
      setField("customerName", surnameName[0], 0.6);
    } else {
      setField("customerName", "");
    }

    // 其餘欄位保持 schema
    [
      "waypoint",
      "carType",
      "carModel",
      "carColor",
      "driver",
      "driverPhone",
      "plate",
      "luggageSize",
      "boosterSeat",
      "childSeat",
      "receipt",
      "price",
      "notes",
    ].forEach((k) => {
      if (!result[k]) setField(k, "");
    });

    return result;
  }

  async function handleAIParse() {
    if (!aiText.trim()) {
      setAiError("請先貼上客戶訊息內容");
      return;
    }
    setAiLoading(true);
    setAiError("");
    setAiDebug("");
    try {
      const parsed = isStructuredTemplate(aiText) ? parseStructuredTemplate(aiText) : localParse(aiText);

      const confidence = {};
      for (const key of AI_FIELD_KEYS) {
        const field = parsed[key];
        confidence[key] = field && typeof field.confidence === "number" ? field.confidence : 0;
      }

      if (formHasData()) {
        setPendingAIData({ parsed, confidence });
      } else {
        applyAIData({ parsed, confidence }, "overwrite");
      }
      setAiDialogOpen(false);
      setAiText("");
    } catch (e) {
      console.error(e);
      setAiError((e && e.message) ? `AI 解析失敗：${e.message}` : "AI解析失敗，請重新嘗試。");
    } finally {
      setAiLoading(false);
    }
  }

  function applyAIData(payload, strategy) {
    const { parsed, confidence } = payload;
    setForm((f) => {
      const next = { ...f };
      for (const key of AI_FIELD_KEYS) {
        const field = parsed[key];
        let value = field && field.value != null ? String(field.value) : "";
        if (key === "carType" && value && !CAR_TYPES.includes(value)) {
          // Not a recognized car type — keep whatever text it is as extra
          // detail in carModel instead of leaving an invalid <select> value.
          if (!parsed.carModel || !parsed.carModel.value) {
            next.carModel = value;
          }
          value = "";
        }
        if (!value) continue;
        if (strategy === "fillEmptyOnly" && next[key] && String(next[key]).trim() !== "") continue;
        next[key] = value;
      }
      return next;
    });
    setAiConfidence(confidence || {});
    setPendingAIData(null);
  }

  function lowConfidenceStyle(key) {
    const c = aiConfidence[key];
    if (typeof c !== "number" || c >= 0.8) return {};
    return { borderColor: "#E8A33D", background: "#FFF8EC" };

  function findConflicts(candidate, excludeOrderNumber) {
    if (!candidate.date || !candidate.time) return [];
    return history.filter((o) => {
      if (o.orderNumber === excludeOrderNumber) return false;
      if (o.status === "已取消") return false;
      if (o.date !== candidate.date || o.time !== candidate.time) return false;
      const sameDriver = candidate.driver && o.driver && candidate.driver.trim() === o.driver.trim();
      const samePlate = candidate.plate && o.plate && candidate.plate.trim() === o.plate.trim();
      return sameDriver || samePlate;
    });
  }

  async function handleSubmitOrder(forceSubmit = false) {
    if (!dataLoaded) {
      setFormError("資料載入中，請稍候一秒再試一次");
      return;
    }
    if (!form.customerName || !form.phone || !form.pickup || !form.dropoff || !form.date || !form.time) {
      setFormError("請填寫姓名、電話、上下車地點、日期與時間");
      return;
    }
    if (!isValidPhone(form.phone)) {
      setFormError("聯絡電話格式不正確，請確認（例如 0912345678 或 02-12345678）");
      return;
    }
    setFormError("");

    if (!forceSubmit) {
      const conflicts = findConflicts(form, editingOrderNumber);
      if (conflicts.length > 0) {
        setConflictInfo({
          orderNumbers: conflicts.map((o) => o.orderNumber),
          driver: form.driver,
          plate: form.plate,
        });
        return;
      }
    }
    setConflictInfo(null);

    if (editingOrderNumber) {
      // Update existing order in place — keep its number, creation time, and status.
      const nextOrders = history.map((o) => {
        if (o.orderNumber !== editingOrderNumber) return o;
        const log = Array.isArray(o.statusLog) ? o.statusLog : [];
        const driverChanged = (o.driver || "") !== (form.driver || "") && form.driver;
        const nextLog = driverChanged
          ? [...log, { status: o.status, at: new Date().toISOString(), driver: form.driver, note: "指派司機" }]
          : log;
        return {
          ...o,
          ...form,
          orderNumber: o.orderNumber,
          createdAt: o.createdAt,
          status: o.status,
          statusLog: nextLog,
          updatedAt: new Date().toISOString(),
        };
      });
      setHistory(nextOrders);
      const updated = nextOrders.find((o) => o.orderNumber === editingOrderNumber);
      setCurrentOrder(updated);
      setEditingOrderNumber(null);
      setForm(emptyForm);
      await persist(nextOrders);
      return;
    }

    const now = new Date();
    let orderNumber;
    const customVal = (form.customSeq || "").trim();
    if (customVal) {
      if (history.some((o) => o.orderNumber === customVal)) {
        setFormError(`訂單編號「${customVal}」已經被使用過，請換一個`);
        return;
      }
      orderNumber = customVal;
    } else {
      orderNumber = generateOrderNumber(now);
      // Astronomically unlikely to collide, but guard anyway.
      let guard = 0;
      while (history.some((o) => o.orderNumber === orderNumber) && guard < 5) {
        orderNumber = generateOrderNumber(now);
        guard += 1;
      }
    }
    const { customSeq: _customSeq, ...formWithoutOverride } = form;
    const newOrder = {
      orderNumber,
      createdAt: now.toISOString(),
      status: "待確認",
      statusLog: [{ status: "待確認", at: now.toISOString(), driver: form.driver || "" }],
      ...formWithoutOverride,
    };
    const nextOrders = [newOrder, ...history].slice(0, 300);
    setHistory(nextOrders);
    setCurrentOrder(newOrder);
    await persist(nextOrders);
  }

  function handleEditOrder(order) {
    setForm({ ...emptyForm, ...order });
    setEditingOrderNumber(order.orderNumber);
    setConflictInfo(null);
    setFormError("");
    setCurrentOrder(order);
  }

  function handleCancelEdit() {
    setEditingOrderNumber(null);
    setForm(emptyForm);
    setConflictInfo(null);
    setFormError("");
  }

  async function updateOrderStatus(orderNumber, newStatus) {
    const nextOrders = history.map((o) => {
      if (o.orderNumber !== orderNumber) return o;
      const log = Array.isArray(o.statusLog) ? o.statusLog : [];
      return {
        ...o,
        status: newStatus,
        statusLog: [...log, { status: newStatus, at: new Date().toISOString(), driver: o.driver || "" }],
      };
    });
    setHistory(nextOrders);
    if (currentOrder && currentOrder.orderNumber === orderNumber) {
      setCurrentOrder(nextOrders.find((o) => o.orderNumber === orderNumber));
    }
    await persist(nextOrders);
  }

  function resetForm() {
    setForm(emptyForm);

  async function handleExport(order) {
    setExportError("");
    setExportLoading(true);
    setExportImage(null);
    try {
      const canvas = await drawTicketCanvas(order);
      const blob = await canvasToBlob(canvas);
      const filename = `${order.orderNumber}.png`;
      const file = new File([blob], filename, { type: "image/png" });

      // Try the native share/save sheet first. Some in-app WebViews
      // (e.g. the ChatGPT iOS app's browser) don't support `<a download>`
      // at all, so Web Share is the primary save path, not a fallback.
      const shareResult = await shareFile(file);
      if (shareResult === true || shareResult === "cancelled") {
        setExportLoading(false);
        return;
      }

      // Web Share unavailable/failed: show the ticket inline so the user
      // can save it manually, with a "儲存圖片" button that retries the
      // share call from a fresh, guaranteed user gesture.
      const previewUrl = await blobToDataURL(blob);
      setExportImage({ url: previewUrl, orderNumber: order.orderNumber, file });
    } catch (e) {
      console.error("image export failed", e);
      setExportError((e && e.message) || "圖片匯出失敗，請重新整理頁面後再試一次。");
    } finally {
      setExportLoading(false);
    }
  }

  async function handleSaveImage() {

    }
  }

  async function handleDeleteHistory(orderNumber) {
    const nextOrders = history.filter((o) => o.orderNumber !== orderNumber);
    setHistory(nextOrders);
    await persist(nextOrders);
    if (currentOrder && currentOrder.orderNumber === orderNumber) {

    }
    if (editingOrderNumber === orderNumber) {

  }

  const filteredHistory = (() => {

    if (!q) return history;
    return history.filter((o) => {
      const haystack = [
        o.customerName,

        o.pickup,
        o.dropoff,
        o.date,
        o.orderNumber,
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
      return haystack.includes(q);
    });
  })();

                value={aiText}
                onChange={(e) => setAiText(e.target.value)}
                disabled={aiLoading}
              />
              {aiError && (
                <div className="error-box" style={{ marginTop: 10 }}><AlertCircle size={14} />{aiError}</div>
              )}
              {aiDebug && (
                <div style={{ marginTop: 10 }}>
                  <div style={{ fontSize: 11.5, fontWeight: 600, color: "#5B6B84", marginBottom: 5 }}>
                    除錯資訊（請長按選取全部文字後複製貼給我）
                  </div>
                  <textarea
                    readOnly
                    className="ai-input mono"
                    style={{ minHeight: 140, fontSize: 11.5, background: "#F7F8FA" }}
                    value={aiDebug}
                    onFocus={(e) => e.target.select()}
                  />
                </div>
              )}
              <div className="conflict-actions" style={{ marginTop: 14 }}>
                <button className="conflict-btn" onClick={closeAIDialog} disabled={aiLoading}>取消</button>
                <button className="conflict-btn primary" onClick={handleAIParse} disabled={aiLoading || !aiText.trim()}>
                  {aiLoading ? "AI解析中…" : "解析"}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {exportImage && (
        <div className="export-modal-overlay" onClick={() => setExportImage(null)}>
          <div className="export-modal" onClick={(e) => e.stopPropagation()}>
            <div className="export-modal-head">
              <span>{exportImage.orderNumber}.png</span>
              <button className="icon-btn" onClick={() => setExportImage(null)}><X size={16} /></button>
            </div>
            <div className="export-modal-body">
              <img src={exportImage.url} alt={`派車單 ${exportImage.orderNumber}`} />
            </div>
            <p className="export-hint">
              點下方「儲存圖片」；若手機沒反應，請直接長按圖片選擇「儲存圖片」
            </p>
            <button className="export-btn primary export-modal-link" onClick={handleSaveImage}>
              <Download size={14} /> 儲存圖片
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<DispatchOrderApp />);
</script>
</body>
</html>
